# Copy of the catalog entry submitted to NousResearch/hermes-agent. The reviewed commit is pinned by the
# `sha:` in the submitted entry (.apex/submission/last-price.yaml in the maintainer's workspace); this copy
# tracks the repo and is not itself a pin.
name: last-price
repo: https://github.com/iamdflame/last-price
sha: pinned-in-the-submitted-entry
description: "Lets Hermes haggle with buyers in chat while the plugin, not the model, owns every price that leaves. You set an item's floor from your terminal; it stays in plugin state and never reaches a model, tool result, prompt or log. Every deal reply is held and checked, and one offering less is rewritten before anyone sees it; deal sessions can use only Last Price's three tools. Includes hermes lastprice duel --vs-prompt, a side-by-side against a seller with the floor in its prompt (inside Hermes: that seller sold below the floor in 10 of 48 duels; Last Price in 0), and hermes lastprice challenge, a public 'buy it below my floor' Telegram challenge. Disclosure — buyer messages and Hermes's draft replies go to your model provider, as in any Hermes chat; a rewrite of a too-low draft goes to the same model (it sees the current counter, never the floor). duel and bench send the buyer's instructions to the buyer model you name and start hermes chat child processes in your terminal (no --yolo): the Last Price seller gets Last Price's three tools only; the stock seller gets Hermes's todo toolset, and its system prompt carries the duel item's floor, which by default is a demo item's throwaway floor, never one of yours unless you pass --item <id> --real-item. challenge start sets Telegram open access and a Last-Price-only Telegram toolset through hermes config set, and challenge end closes access again. No payment provider is called in 0.1.x, no telemetry."
maintainer: iamdflame
tier: community
category: tools
version: "0.1.2"
requires_hermes: ">=0.23.1"
docs_url: https://github.com/iamdflame/last-price#readme
title: Last Price
platforms: []
known_issues:
- "Pay links are placeholders in 0.1.x (no payment provider is called)."
- "Telegram and WhatsApp deal chats (hermes lastprice shop on <platform>) and the Telegram challenge (hermes lastprice challenge) are unit-tested; no live messaging run yet, so the live runs so far are terminal duels and benches."
capabilities:
  provides_tools: [lastprice_items, lastprice_offer, lastprice_extra]
  provides_hooks: [pre_llm_call, pre_tool_call, transform_llm_output]
  provides_middleware: []
  requires_env: []
