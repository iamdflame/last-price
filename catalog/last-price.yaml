# A copy of this plugin's entry in the Hermes plugin catalog. The submitted entry pins `sha:` and the image
# and screenshot URLs to the reviewed commit; this copy pins the 0.1.6 code commit so it validates on its own.
name: last-price
repo: https://github.com/iamdflame/last-price
sha: 8836cdd89a511a09a4cca02949ed0a5b040d5b1f
description: "Lets Hermes haggle with buyers in chat while the plugin, not the model, owns every price that leaves. You set an item's floor from your terminal; it stays in plugin state and never reaches a model, tool result, prompt or log. Every deal reply is held and checked, and one offering less is rewritten before anyone sees it; a buyer who offers or accepts a price the plugin would take is closed at their own number; deal sessions can use only Last Price's three tools (plus Hermes's tool-search bridge, whose calls are checked the same way). Includes hermes lastprice duel --vs-prompt, a side-by-side against a seller with the floor in its prompt (inside Hermes, in the 48-duel bench of version 0.1.1: that seller sold below the floor in 10 of 48 duels; Last Price in 0), and hermes lastprice challenge, a public 'buy it below my floor' Telegram challenge. Disclosure — buyer messages and Hermes's draft replies go to your model provider, as in any Hermes chat; a rewrite of a too-low draft goes to the same model (it sees the buyer's message, the draft and the current counter, never the floor). In a duel or bench, the buyer model (your own model, or the one you name with --buyer) receives the buyer's instruction and the whole conversation so far, the seller's replies included. duel and bench start hermes chat child processes in your terminal (no --yolo; with --ignore-rules and --source tool, so your own rules and memory stay out and the duel sessions stay out of your session list): the Last Price seller gets Last Price's three tools only; the stock seller gets Hermes's todo toolset plus every plugin toolset your profile turns on by default, and its system prompt carries the duel item's floor, which by default is a demo item's throwaway floor, never one of yours unless you pass --item <id> --real-item. Hermes saves that prompt with the stock session in state.db; each duel deletes its stock session when it ends (hermes sessions delete), and the stock seller's replies stay in Hermes's 7-day deletion tombstones and in Last Price's duel records (and the deleted bytes in state.db's free pages until hermes sessions optimize). hermes chat starts Hermes's background gateway when none is running; a duel or bench that started it stops it when it ends. challenge start and shop on run only in a profile with memory off (memory.memory_enabled and memory.user_profile_enabled false, no memory.provider; read with hermes config get, and refused if unreadable), and every turn of a stranger's deal chat checks again in process (hermes_cli.config.load_config, read on every turn): while memory is on or unreadable, the turn gets a neutral 'the shop is paused' reply and no model call. Hermes saves a chat's system prompt and replays it across restarts, so a chat held once (or first seen past its first turn) stays held, recorded in plugin state, until you run hermes lastprice shop release with memory off and the gateway stopped; it runs hermes sessions refresh-prompts, so Hermes rebuilds each prompt without memory. Run them from a dedicated profile (hermes -p shop ...) with a neutral SOUL.md. challenge start changes six Hermes settings through hermes config set (Telegram open access, a Last-Price-only Telegram toolset, owner-only slash commands) after reading their earlier values one by one with hermes config get (it reads no .env); a key whose config.yaml value holds a ${VAR} reference, which hermes config get reports expanded, is saved as written (read with Hermes's hermes_cli.config.read_user_config_raw), and challenge end restores all six, the reference as written. Floors are stored as plain JSON in plugin state: hidden from the model in deal sessions, readable on your machine by you and by any agent you give file tools to. No payment provider is called in 0.1.x, no telemetry."
